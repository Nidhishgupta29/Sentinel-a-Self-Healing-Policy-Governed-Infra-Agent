services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8000"]

  demo_app:
    build: .
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      SENTINEL_DB_PATH: /app/demo_app/sentinel.db
    command: ["uvicorn", "demo_app.main:app", "--host", "0.0.0.0", "--port", "8000"]
